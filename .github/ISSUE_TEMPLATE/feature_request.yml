name: Feature request
description: Suggest something new for OrbitCP
labels: ["idea"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the job you're trying to get done, not only the button you'd like.
      placeholder: I host 20 client websites and want to send each client a monthly usage report…
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could OrbitCP help?
  - type: textarea
    id: today
    attributes:
      label: How do you do it today?
      description: Another panel, a script, by hand…
