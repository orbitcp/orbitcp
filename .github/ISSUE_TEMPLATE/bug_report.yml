name: Bug report
description: Something in OrbitCP doesn't work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please don't paste passwords, license keys or private keys.
        Security problems go to support@orbitcp.pro instead (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, and what went wrong?
      placeholder: 'I added a website and turned on SSL, then the page showed "Certificate failed …"'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to Websites → Add website
        2. …
  - type: input
    id: version
    attributes:
      label: OrbitCP version
      description: Run `orbitcp version` on the server.
      placeholder: "0.13.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Ubuntu 24.04
        - Ubuntu 22.04
        - Debian 12
        - Other
    validations:
      required: true
  - type: input
    id: provider
    attributes:
      label: VPS provider
      placeholder: Linode, DigitalOcean, Hetzner, …
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: "Useful: `journalctl -u orbitcp-api -n 50` and `journalctl -u orbitcp-agent -n 50`"
      render: shell
